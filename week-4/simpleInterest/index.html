<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Interest</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="input">
        <input
          type="text"
          class="inputs"
          placeholder="Principal"
          id="principal"
        />
        <input type="text" class="inputs" placeholder="Rate" id="rate" />
        <input type="text" class="inputs" placeholder="Time" id="time" />
      </div>

      <div class="btn-container">
        <button class="btn" onclick="calculateInterest()">Calculate</button>
      </div>

      <div id="finalSum" class="finalSum"></div>
    </div>
  </body>
</html>
